[graph]
targets = ["x86_64-unknown-linux-gnu"]
exclude-dev = true

[advisories]
ignore = [
    {
        id = "RUSTSEC-2026-0192",
        reason = "ttf-parser comes in through winit's sctk-adwaita window decorations, which have no maintained replacement yet"
    }
]

[licenses]
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib"
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
