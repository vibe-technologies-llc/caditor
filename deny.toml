[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
exclude-dev = true

[advisories]
ignore = [
    {
        id = "RUSTSEC-2026-0192",
        reason = "ttf-parser comes in only through winit's sctk-adwaita window decorations, which have no maintained replacement yet"
    }
]

[licenses]
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib"
]
exceptions = [
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] }
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "bzip2-sys", reason = "C library; caditor uses pure-Rust crates" },
    { crate = "freetype-sys", reason = "C library; egui rasterises fonts in Rust" },
    { crate = "libdbus-sys", reason = "C library; zbus speaks D-Bus in Rust" },
    { crate = "libsqlite3-sys", reason = "C library; caditor uses pure-Rust crates" },
    { crate = "libz-sys", reason = "C library; miniz_oxide and zlib-rs cover deflate" },
    { crate = "lzma-sys", reason = "C library; caditor uses pure-Rust crates" },
    { crate = "native-tls", reason = "C-backed TLS; rustls is the Rust alternative" },
    { crate = "openssl", reason = "C-backed TLS; rustls is the Rust alternative" },
    { crate = "openssl-sys", reason = "C library; rustls is the Rust alternative" },
    { crate = "servo-fontconfig-sys", reason = "C library; caditor loads its own fonts" },
    { crate = "zstd-sys", reason = "C library; caditor-zstd wraps the Rust port" }
]
skip = [
    { crate = "accesskit@0.24.1", reason = "egui-phosphor 0.14 is still on egui 0.36" },
    {
        crate = "calloop-wayland-source@0.3.0",
        reason = "winit 0.30 stays on smithay-client-toolkit 0.19"
    },
    {
        crate = "calloop@0.13.0",
        reason = "winit 0.30 stays on smithay-client-toolkit 0.19 while egui's clipboard moved to 0.20"
    },
    { crate = "ecolor@0.36.2", reason = "egui-phosphor 0.14 is still on egui 0.36" },
    { crate = "egui@0.36.2", reason = "egui-phosphor 0.14 is still on egui 0.36" },
    { crate = "emath@0.36.2", reason = "egui-phosphor 0.14 is still on egui 0.36" },
    { crate = "epaint@0.36.2", reason = "egui-phosphor 0.14 is still on egui 0.36" },
    {
        crate = "foldhash@0.1.5",
        reason = "petgraph under arboard's Wayland clipboard (wl-clipboard-rs) has not moved to 0.2"
    },
    { crate = "getrandom@0.3.4", reason = "ahash 0.8 has not moved to getrandom 0.4" },
    {
        crate = "hashbrown@0.15.5",
        reason = "petgraph under arboard's Wayland clipboard (wl-clipboard-rs) has not moved to 0.17"
    },
    {
        crate = "hashbrown@0.16.1",
        reason = "accesskit and gpu-allocator have not moved to hashbrown 0.17"
    },
    { crate = "linux-raw-sys@0.4.15", reason = "rustix 0.38 under winit's calloop 0.13" },
    { crate = "miniz_oxide@0.8.9", reason = "png 0.18 has not moved to miniz_oxide 0.9" },
    {
        crate = "read-fonts@0.41.0",
        reason = "epaint's harfrust pins an older read-fonts than caditor-file's skrifa"
    },
    { crate = "rustc-hash@1.1.0", reason = "naga 30 still uses rustc-hash 1" },
    { crate = "rustix@0.38.44", reason = "winit's calloop 0.13" },
    {
        crate = "skrifa@0.44.0",
        reason = "epaint's harfrust pins an older skrifa than caditor-file's font outlines"
    },
    {
        crate = "smithay-client-toolkit@0.19.2",
        reason = "winit 0.30 stays on 0.19 while egui's clipboard moved to 0.20"
    },
    { crate = "syn@2.0.119", reason = "most proc macros are still on syn 2" },
    { crate = "thiserror-impl@1.0.69", reason = "winit's calloop 0.13 still uses thiserror 1" },
    { crate = "thiserror@1.0.69", reason = "winit's calloop 0.13 still uses thiserror 1" },
    { crate = "zbus@5.19.0", reason = "accesskit_unix under egui-winit still uses zbus 5" },
    { crate = "zbus_macros@5.19.0", reason = "accesskit_unix under egui-winit still uses zbus 5" },
    { crate = "windows-sys@0.52.0", reason = "winit 0.30 on Windows" },
    {
        crate = "windows-sys@0.59.0",
        reason = "rustix 0.38 under winit's calloop 0.13, reached through its Windows target table"
    },
    { crate = "vello_common@0.1.0", reason = "egui-phosphor 0.14 is still on egui 0.36" },
    { crate = "vello_cpu@0.1.0", reason = "egui-phosphor 0.14 is still on egui 0.36" },
    {
        crate = "windows-targets@0.52.6",
        reason = "windows-sys 0.52 and 0.59 under winit and rustix 0.38"
    },
    {
        crate = "windows_x86_64_gnu@0.52.6",
        reason = "windows-targets 0.52 under winit and rustix 0.38"
    },
    {
        crate = "windows_x86_64_msvc@0.52.6",
        reason = "windows-targets 0.52 under winit and rustix 0.38"
    }
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
