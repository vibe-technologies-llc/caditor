[package]
name = "caditor-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[lib]
path = "src/lib.rs"
test = false
doc = false

[dependencies]
caditor = { path = "../crates/caditor", features = ["fuzzing"] }
caditor-document.path = "../crates/caditor-document"
caditor-expression.path = "../crates/caditor-expression"
caditor-file = { path = "../crates/caditor-file", features = ["fuzzing"] }
caditor-geometry.path = "../crates/caditor-geometry"
caditor-kernel.path = "../crates/caditor-kernel"
caditor-sketch.path = "../crates/caditor-sketch"
caditor-step.path = "../crates/caditor-step"
caditor-zstd.path = "../crates/caditor-zstd"

libfuzzer-sys = "0.4.13"

[workspace]
members = ["."]

[[bin]]
name = "expression"
path = "fuzz_targets/expression.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dxf"
path = "fuzz_targets/dxf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "svg"
path = "fuzz_targets/svg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model"
path = "fuzz_targets/model.rs"
test = false
doc = false
bench = false

[[bin]]
name = "step"
path = "fuzz_targets/step.rs"
test = false
doc = false
bench = false

[[bin]]
name = "step_import"
path = "fuzz_targets/step_import.rs"
test = false
doc = false
