[package]
name = "caditor-file"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
fuzzing = []

[dependencies]
caditor-document.workspace = true
caditor-expression.workspace = true
caditor-geometry.workspace = true
caditor-kernel.workspace = true
caditor-sketch.workspace = true
caditor-step.workspace = true
caditor-zstd.workspace = true

blake3.workspace = true
crc32fast.workspace = true
log.workspace = true
miniz_oxide.workspace = true
parking_lot.workspace = true
png.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
thiserror.workspace = true
xxhash-rust.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "std"] }
xattr.workspace = true

[target.'cfg(windows)'.dependencies]
caditor-windows.workspace = true

[dev-dependencies]
tempfile.workspace = true
