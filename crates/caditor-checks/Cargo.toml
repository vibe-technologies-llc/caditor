[package]
name = "caditor-checks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
expect_used = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[dependencies]
caditor-document.workspace = true
caditor-expression.workspace = true
caditor-file = { workspace = true, features = ["fuzzing"] }
caditor-geometry.workspace = true
caditor-kernel.workspace = true
caditor-sketch.workspace = true
caditor-step.workspace = true

arbitrary.workspace = true
