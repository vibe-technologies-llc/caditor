name: Install cargo-nextest
description: Installs cargo-nextest from its pinned release, checked against its SHA-256 sum.
runs:
  using: composite
  steps:
    - name: Download, check and unpack cargo-nextest ${{ env.CARGO_NEXTEST_VERSION }}
      if: runner.os != 'Windows'
      shell: sh
      run: |
        set -eu
        [ -n "${CARGO_NEXTEST_VERSION:-}" ] && [ -n "${CARGO_NEXTEST_SHA256:-}" ] || {
          echo "Load .github/versions.env before installing cargo-nextest" >&2
          exit 1
        }
        name="cargo-nextest-$CARGO_NEXTEST_VERSION-x86_64-unknown-linux-musl.tar.gz"
        directory=$(mktemp -d)
        curl --proto '=https' --tlsv1.2 -sSfL -o "$directory/$name" \
          "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$CARGO_NEXTEST_VERSION/$name"
        echo "$CARGO_NEXTEST_SHA256  $directory/$name" | sha256sum -c -
        tar -xzf "$directory/$name" -C /usr/local/bin cargo-nextest
        rm -r "$directory"
    - name: Download, check and unpack cargo-nextest.exe ${{ env.CARGO_NEXTEST_VERSION }}
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -eu
        [ -n "${CARGO_NEXTEST_VERSION:-}" ] && [ -n "${CARGO_NEXTEST_WINDOWS_SHA256:-}" ] || {
          echo "Load .github/versions.env before installing cargo-nextest" >&2
          exit 1
        }
        name="cargo-nextest-$CARGO_NEXTEST_VERSION-x86_64-pc-windows-msvc.tar.gz"
        directory=$(mktemp -d)
        curl --proto '=https' --tlsv1.2 -sSfL -o "$directory/$name" \
          "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$CARGO_NEXTEST_VERSION/$name"
        echo "$CARGO_NEXTEST_WINDOWS_SHA256  $directory/$name" | sha256sum -c -
        mkdir -p "$HOME/.cargo/bin"
        tar -xzf "$directory/$name" -C "$HOME/.cargo/bin" cargo-nextest.exe
        rm -r "$directory"
