name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_ABOUT_VERSION: 0.9.2
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            appstream build-essential ca-certificates curl desktop-file-utils git zstd

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-about
        run: cargo install --locked cargo-about --version "$CARGO_ABOUT_VERSION" --features cli

      - name: Test
        run: cargo test --workspace --locked

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build the release archive
        run: packaging/build-release.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release
          if-no-files-found: error
          path: |
            target/dist/*.tar.zst
            target/dist/*.tar.zst.sha256
            target/dist/release-notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "caditor ${GITHUB_REF_NAME#v}" \
            --notes-file dist/release-notes.md \
            dist/*.tar.zst dist/*.tar.zst.sha256
