name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.98.1
  CARGO_ABOUT_VERSION: 0.9.2
  CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
  CARGO_TERM_COLOR: always

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 45
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            appstream build-essential ca-certificates curl desktop-file-utils git zstd

      - name: Check out (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-about
        run: |
          name="cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfLO \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$name.tar.gz"
          echo "$CARGO_ABOUT_SHA256  $name.tar.gz" | sha256sum -c -
          tar -xzf "$name.tar.gz" -C "$HOME/.cargo/bin" --strip-components=1 "$name/cargo-about"
          rm "$name.tar.gz"

      - name: Build the release archive
        run: packaging/build-release.sh

      - name: Install and uninstall the archive
        run: packaging/check-install.sh target/dist/caditor-*-linux-x86_64.tar.zst

      - name: Keep the archive (actions/upload-artifact v7.0.1)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release
          if-no-files-found: error
          path: |
            target/dist/*.tar.zst
            target/dist/*.tar.zst.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the archive (actions/download-artifact v8.0.1)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "caditor ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/*.tar.zst dist/*.tar.zst.sha256
