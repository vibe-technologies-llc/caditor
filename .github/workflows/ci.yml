name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  FUZZ_SECONDS: 60

jobs:
  check:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 45
    env:
      BUILDER_HOME: /home/builder
    steps:
      - name: Install build tools and a software Vulkan driver
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libvulkan1 mesa-vulkan-drivers zstd

      - name: Add an unprivileged user, since root ignores file modes the tests rely on
        run: |
          useradd --uid 1001 --create-home --home-dir "$BUILDER_HOME" builder
          printf '%s\n' '#!/bin/sh' \
            "exec runuser -u builder -- env HOME=$BUILDER_HOME PATH=$BUILDER_HOME/.cargo/bin:\$PATH \"\$@\"" \
            > /usr/local/bin/as-builder
          chmod +x /usr/local/bin/as-builder

      - name: Check out (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load the pinned versions
        run: cat .github/versions.env >> "$GITHUB_ENV"

      - name: Restore the cargo cache (actions/cache v6.1.0)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            /home/builder/.cargo/registry/index
            /home/builder/.cargo/registry/cache
            /home/builder/.cargo/git/db
            target
          key: check-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-${{ env.RUST_TOOLCHAIN }}-

      - name: Hand the checkout and the cache to the unprivileged user
        run: chown -R builder:builder "$GITHUB_WORKSPACE" "$BUILDER_HOME"

      - name: Install Rust
        uses: ./.github/actions/install-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          run-as: as-builder

      - name: Test
        env:
          CADITOR_REQUIRE_GPU: "1"
        run: as-builder cargo test --workspace --locked

      - name: Check that the tests left the checkout clean
        run: |
          status=$(as-builder git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            echo "The tests changed or left files in the checkout:"
            echo "$status"
            exit 1
          fi

      - name: Lint
        run: as-builder cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Install cargo-deny
        run: |
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfLO \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $name.tar.gz" | sha256sum -c -
          tar -xzf "$name.tar.gz" -C /usr/local/bin --strip-components=1 "$name/cargo-deny"
          rm "$name.tar.gz"

      - name: Check dependencies
        run: as-builder cargo deny --locked check

      - name: Check the fuzz workspace's dependencies
        run: as-builder cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked check

  stress:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 45
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git zstd

      - name: Check out (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load the pinned versions
        run: cat .github/versions.env >> "$GITHUB_ENV"

      - name: Restore the cargo cache (actions/cache v6.1.0)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: stress-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: stress-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Rust
        uses: ./.github/actions/install-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Count the booleans of random placements that fail
        run: |
          cargo test --release --locked -p caditor-kernel -- --ignored --exact \
            boolean::tests::random_placements_of_every_fixture

      - name: Time the diagnosis of conflicts across hundreds of entities
        run: |
          cargo test --release --locked -p caditor-sketch -- --ignored --exact \
            solve::diagnosis_tests::a_conflict_across_hundreds_of_entities_is_named_within_seconds

      - name: Time a large STEP import from reading to every body shown
        run: |
          cargo test --release --locked -p caditor --lib -- --ignored --exact --nocapture \
            ui_tests::import_costs::a_large_step_import_is_timed_stage_by_stage

  format:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 20
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git zstd

      - name: Check out (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load the pinned versions
        run: cat .github/versions.env >> "$GITHUB_ENV"

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust
        uses: ./.github/actions/install-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install the formatting toolchain
        run: rustup toolchain install "$FORMAT_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Restore rust-formatter (actions/cache v6.1.0)
        id: formatter
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/rust-formatter
          key: rust-formatter-${{ env.RUST_FORMATTER_REV }}-${{ env.RUST_TOOLCHAIN }}

      - name: Install rust-formatter
        if: steps.formatter.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --git https://github.com/vibe-technologies-llc/rust-formatter \
            --rev "$RUST_FORMATTER_REV" rust-formatter

      - name: Check formatting
        run: rust-formatter --check --toolchain "$FORMAT_TOOLCHAIN"

  package:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 45
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            appstream build-essential ca-certificates curl desktop-file-utils git zstd

      - name: Check out (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Load the pinned versions
        run: cat .github/versions.env >> "$GITHUB_ENV"

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust
        uses: ./.github/actions/install-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Restore the cargo cache (actions/cache v6.1.0)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: package-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: package-${{ env.RUST_TOOLCHAIN }}-

      - name: Build a snapshot archive
        run: packaging/build-release.sh --snapshot

      - name: Install and uninstall the snapshot
        run: packaging/check-install.sh target/dist/caditor-*-snapshot-linux-x86_64.tar.zst

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load the pinned versions
        run: cat .github/versions.env >> "$GITHUB_ENV"

      - name: Restore the cargo cache (actions/cache v6.1.0)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Rust
        uses: ./.github/actions/install-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Test
        env:
          CADITOR_REQUIRE_GPU: "1"
        run: cargo test --workspace --locked --no-fail-fast

      - name: Check that the tests left the checkout clean
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            echo "The tests changed or left files in the checkout:"
            echo "$status"
            exit 1
          fi

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  package-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Load the pinned versions
        run: cat .github/versions.env >> "$GITHUB_ENV"

      - name: Install Rust
        uses: ./.github/actions/install-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Restore the cargo cache (actions/cache v6.1.0)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: package-windows-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: package-windows-${{ env.RUST_TOOLCHAIN }}-

      - name: Install WiX
        run: .github/install-windows-packaging.sh

      - name: Build a snapshot installer
        shell: pwsh
        run: packaging/windows/build-release.ps1 -Snapshot

      - name: Install, upgrade and uninstall the snapshot
        shell: pwsh
        run: packaging/windows/check-install.ps1 (Get-Item target/dist/caditor-*-snapshot-windows-x86_64.msi)

  fuzz:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: expression, seeds: expression, dictionary: expression }
          - { target: dxf, seeds: dxf, dictionary: dxf }
          - { target: svg, seeds: svg, dictionary: svg }
          - { target: model, seeds: model, dictionary: model }
          - { target: model_sealed, seeds: model, dictionary: model }
          - { target: journal, seeds: journal, dictionary: model }
          - { target: journal_torn, seeds: journal, dictionary: model }
          - { target: zstd, seeds: zstd, dictionary: zstd }
          - { target: step, seeds: step, dictionary: step }
          - { target: step_import, seeds: step, dictionary: step }
          - { target: preferences, seeds: preferences, dictionary: json }
          - { target: recent_files, seeds: recent_files, dictionary: json }
          - { target: profile_sweep, seeds: structured, dictionary: none }
          - { target: boolean, seeds: structured, dictionary: none }
          - { target: sketch_solve, seeds: structured, dictionary: none }
          - { target: document, seeds: structured, dictionary: none }
          - { target: save_load, seeds: structured, dictionary: none }
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git zstd

      - name: Check out (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load the pinned versions
        run: cat .github/versions.env >> "$GITHUB_ENV"

      - name: Install Rust
        uses: ./.github/actions/install-rust
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}

      - name: Install cargo-fuzz
        run: |
          name="cargo-fuzz-$CARGO_FUZZ_VERSION-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfLO \
            "https://github.com/rust-fuzz/cargo-fuzz/releases/download/$CARGO_FUZZ_VERSION/$name.tar.gz"
          echo "$CARGO_FUZZ_SHA256  $name.tar.gz" | sha256sum -c -
          tar -xzf "$name.tar.gz" -C "$HOME/.cargo/bin" cargo-fuzz
          rm "$name.tar.gz"

      - name: Check that the fuzz lock file is current
        working-directory: fuzz
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Restore the fuzz build (actions/cache v6.1.0)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            fuzz/target
          key: fuzz-${{ env.FUZZ_TOOLCHAIN }}-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: fuzz-${{ env.FUZZ_TOOLCHAIN }}-${{ matrix.target }}-

      - name: Restore the corpus (actions/cache v6.1.0)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        working-directory: fuzz
        shell: bash
        run: |
          mkdir -p "corpus/${{ matrix.target }}"
          dictionary=()
          if [ "${{ matrix.dictionary }}" != none ]; then
            dictionary=(-dict="dictionaries/${{ matrix.dictionary }}.dict")
          fi
          cargo fuzz run --target x86_64-unknown-linux-gnu "${{ matrix.target }}" \
            "corpus/${{ matrix.target }}" "seeds/${{ matrix.seeds }}" -- \
            "${dictionary[@]}" \
            -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=2048 -timeout=10

      - name: Keep the failing input (actions/upload-artifact v7.0.1)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
