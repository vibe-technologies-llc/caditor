name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1
  FUZZ_TOOLCHAIN: nightly-2026-09-27
  FORMAT_TOOLCHAIN: nightly-2026-09-27
  RUST_FORMATTER_REV: 310b16514936b50b8f9491a6f892651de3dfdf7f
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  CARGO_FUZZ_VERSION: 0.13.2
  CARGO_FUZZ_SHA256: b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c
  CARGO_ABOUT_VERSION: 0.9.2
  CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
  FUZZ_SECONDS: 60

jobs:
  check:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 45
    steps:
      - name: Install build tools and a software Vulkan driver
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libvulkan1 mesa-vulkan-drivers

      - name: Check out (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN" \
              --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Test
        env:
          CADITOR_REQUIRE_GPU: "1"
        run: cargo test --workspace --locked

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Install cargo-deny
        run: |
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfLO \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $name.tar.gz" | sha256sum -c -
          tar -xzf "$name.tar.gz" -C "$HOME/.cargo/bin" --strip-components=1 "$name/cargo-deny"
          rm "$name.tar.gz"

      - name: Check dependencies
        run: cargo deny --locked check

  format:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 20
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git

      - name: Check out (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          "$HOME/.cargo/bin/rustup" toolchain install "$FORMAT_TOOLCHAIN" \
            --profile minimal --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install rust-formatter
        run: |
          cargo install --locked --git https://github.com/vibe-technologies-llc/rust-formatter \
            --rev "$RUST_FORMATTER_REV" rust-formatter

      - name: Check formatting
        run: rust-formatter --check --toolchain "$FORMAT_TOOLCHAIN"

  package:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 45
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            appstream build-essential ca-certificates curl desktop-file-utils git zstd

      - name: Check out (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-about
        run: |
          name="cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfLO \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$name.tar.gz"
          echo "$CARGO_ABOUT_SHA256  $name.tar.gz" | sha256sum -c -
          tar -xzf "$name.tar.gz" -C "$HOME/.cargo/bin" --strip-components=1 "$name/cargo-about"
          rm "$name.tar.gz"

      - name: Build a snapshot archive
        run: packaging/build-release.sh --snapshot

      - name: Install and uninstall the snapshot
        run: packaging/check-install.sh target/dist/caditor-*-snapshot-linux-x86_64.tar.zst

  fuzz:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: expression, seeds: expression, dictionary: expression }
          - { target: dxf, seeds: dxf, dictionary: dxf }
          - { target: model, seeds: model, dictionary: model }
          - { target: model_sealed, seeds: model, dictionary: model }
          - { target: journal, seeds: journal, dictionary: model }
          - { target: zstd, seeds: zstd, dictionary: zstd }
          - { target: step, seeds: step, dictionary: step }
          - { target: step_import, seeds: step, dictionary: step }
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git

      - name: Check out (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$FUZZ_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-fuzz
        run: |
          name="cargo-fuzz-$CARGO_FUZZ_VERSION-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfLO \
            "https://github.com/rust-fuzz/cargo-fuzz/releases/download/$CARGO_FUZZ_VERSION/$name.tar.gz"
          echo "$CARGO_FUZZ_SHA256  $name.tar.gz" | sha256sum -c -
          tar -xzf "$name.tar.gz" -C "$HOME/.cargo/bin" cargo-fuzz
          rm "$name.tar.gz"

      - name: Fuzz
        working-directory: fuzz
        run: |
          mkdir -p "corpus/${{ matrix.target }}"
          cargo fuzz run "${{ matrix.target }}" \
            "corpus/${{ matrix.target }}" "seeds/${{ matrix.seeds }}" -- \
            -dict="dictionaries/${{ matrix.dictionary }}.dict" \
            -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=2048 -timeout=10

      - name: Keep the failing input (actions/upload-artifact v7.0.1)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
